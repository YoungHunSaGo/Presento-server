[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "presento-server"
version = "0.1.0"
description = "Presento 발표 영상 분석 백엔드"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.7",
    "celery==5.6.3",
    "redis==8.1.0",
    "boto3==1.43.123",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "mediapipe==1.2.0",
    "openai==3.44.0",
    "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "pyyaml==6.0.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.txt", "prompts/*.md", "services/pipeline/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() 기본값 패턴

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]  # S311: 테스트 잡음용 random

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # 루트의 alembic/ 폴더와 혼동하지 않게
